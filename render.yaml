services:
  - type: web
    name: brandguard-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:////tmp/brandguard.db
      - key: SECRET_KEY
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        value: J9QNpPShW3rOz3uXQ5-j7CoFpBKQ-Kp2CSPSOnjOU8w=
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
      - key: FRONTEND_URL
        value: http://localhost:3000
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: INSTAGRAM_REDIRECT_URI
        sync: false
