[project]
name = "brandguard-ai"
version = "1.0.0"
description = "Enterprise AI Brand Governance & Reputation Protection Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.0.0",
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "python-docx>=1.1.0",
    "pypdf>=4.0.0",
    "reportlab>=4.0.0",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "google-genai>=0.1.0",
    "email-validator>=2.0.0",
]

[tool.vercel]
entrypoint = "main:app"

[tool.vercel.scripts]
build = "npm --prefix frontend install && npm --prefix frontend run build"
